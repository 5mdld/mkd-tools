[project]
site_name = "mkd"
site_url = "https://kiwakiwaa.github.io/mkd-tools/"
repo_url = "https://github.com/kiwakiwaa/mkd-tools"
site_description = "Read, search, and create Monokakido dictionaries"
docs_dir = "docs"
site_dir = "build/docs"
nav = [
    { "Overview" = "README.md" },
    { "Core concepts" = "concepts.md" },
    { "Reading dictionaries" = "reading/browsing.md" },
    { "Searching" = "reading/searching.md" },
    { "Exporting dictionaries" = "reading/exporting.md" },
    { "Creating a dictionary" = "creating/minimal_dictionary.md" },
    { "Subentries and links" = "creating/subentries.md" },
    { "Gaiji and ruby" = "creating/inline_content.md" },
    { "Images, audio, fonts and CSS" = "creating/resources.md" },
    { "Appendices and entry order" = "creating/navigation.md" },
]

[project.theme]
features = ["content.tabs.link", "content.code.copy"]
font = false

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/monitor"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
