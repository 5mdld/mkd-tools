[project]
site_name = "mkd"
site_url = "https://kiwakiwaa.github.io/mkd-tools/"
repo_url = "https://github.com/kiwakiwaa/mkd-tools"
site_description = "Read, search, and create Monokakido dictionaries"
docs_dir = "docs"
site_dir = "build/docs"
extra_css = ["assets/stylesheets/reference.css"]
nav = [
    { "Start here" = [
        { "Installation and CLI" = "README.md" },
        { "Products, dictionaries and articles" = "concepts.md" },
    ] },
    { "Build from source" = "setup/building.md" },
    { "Reading" = [
        { "Open a dictionary" = "reading/products.md" },
        { "Articles and headlines" = "reading/articles.md" },
        { "Media, fonts and stylesheets" = "reading/resources.md" },
        { "Native indexes" = "reading/navigation.md" },
        { "Appendix menus" = "reading/appendices.md" },
        { "Article order" = "reading/order.md" },
        { "Export resources" = "reading/exporting.md" },
    ] },
    { "Searching" = [
        { "Search and open results" = "searching/queries.md" },
        { "Scopes and matching" = "searching/matching.md" },
        { "Native search rules" = "searching/dictionary_rules.md" },
    ] },
    { "Authoring" = [
        { "Your first dictionary" = "authoring/first_dictionary.md" },
        { "Product information and licenses" = "authoring/information.md" },
        { "Product icons" = "authoring/icons.md" },
        { "Article XML" = "authoring/articles.md" },
        { "Headlines" = "authoring/headlines.md" },
        { "Search keys" = "authoring/search_keys.md" },
        { "Subentries and links" = "authoring/subentries.md" },
        { "Article section menu" = "authoring/article_menu.md" },
        { "Ruby" = "authoring/ruby.md" },
        { "Gaiji" = "authoring/gaiji.md" },
        { "Images and audio" = "authoring/media.md" },
        { "Fonts" = "authoring/fonts.md" },
        { "Article styling" = "authoring/styling.md" },
        { "Category navigation" = "authoring/navigation.md" },
        { "Kanwa indexes" = "authoring/kanwa_navigation.md" },
        { "Appendices" = "authoring/appendices.md" },
        { "Article order" = "authoring/order.md" },
        { "Finish, install and update" = "authoring/publishing.md" },
    ] },
    { "Reference" = [
        { "Native CSS" = "reference/article_css.md" },
        { "Native layout examples" = "reference/layout_examples.md" },
        { "Mathematical notation" = "reference/mathematics.md" },
        { "Search scopes and profiles" = "reference/search_profiles.md" },
        { "Stored indexes" = "reference/indexes.md" },
        { "Errors and lifetimes" = "reference/errors.md" },
        { "Buffers and resource inputs" = "reference/buffers.md" },
        { "Import IDs and build options" = "reference/authoring_options.md" },
    ] },
]

[project.theme]
features = ["content.tabs.link", "content.code.copy"]
font = false

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/monitor"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
