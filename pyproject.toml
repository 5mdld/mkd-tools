[build-system]
requires = ["scikit-build-core>=1.1,<2", "nanobind>=3.1,<4"]
build-backend = "scikit_build_core.build"

[project]
name = "mkd-tools"
version = "0.9.0"
description = "Read, search, and create Monokakido dictionaries"
readme = "README.md"
license = "GPL-3.0-only"
license-files = [
    "LICENSE",
    "python/THIRD_PARTY_NOTICES.txt",
    "src/platform/macos/bindings/LICENSE-APACHE-2.0.txt",
    "third_party/glaze/LICENSE",
    "third_party/pugixml/LICENSE.md",
    "third_party/stb/LICENSE",
    "third_party/utf8proc/LICENSE.md",
    "third_party/zlib/LICENSE",
]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: C++",
    "Typing :: Typed",
]

[project.urls]
Documentation = "https://kiwakiwaa.github.io/mkd-tools/"
Source = "https://github.com/kiwakiwaa/mkd-tools"
Issues = "https://github.com/kiwakiwaa/mkd-tools/issues"

[tool.scikit-build]
cmake.version = ">=3.31"
wheel.packages = ["python/mkd"]
build.targets = ["_mkd", "mkd-python-stubs"]
sdist.exclude = [
    "/.cache/",
    "/.github/",
    "/.idea/",
    "/.venv/",
    "/build*/",
    "/dist/",
    "/docs/",
    "/examples/",
    "/test/",
    "/zensical.toml",
]

[tool.scikit-build.cmake.define]
MKD_BUILD_PYTHON = "ON"
MKD_BUILD_CLI = "OFF"
BUILD_TESTING = "OFF"

[tool.cibuildwheel]
build = "cp3{10,11,12,13,14}-*"
skip = "*-musllinux_*"
test-command = '''python -c "import mkd, tempfile; from pathlib import Path; entry = mkd.EntryId(123, 4); assert entry.page_id == 123 and entry.item_id == 4; directory = tempfile.TemporaryDirectory(); assert mkd.DirectoryDictionarySource(Path(directory.name)).find_all_available() == []; directory.cleanup()"'''

[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET = "14.0" }

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_34"
before-all = [
    "dnf install -y openssl-devel",
    '''install -Dm644 /usr/share/licenses/openssl-libs/LICENSE.txt "{package}/python/mkd/licenses/OpenSSL.txt"''',
]
environment = { LDFLAGS = "-static-libstdc++ -static-libgcc" }
repair-wheel-command = "auditwheel show {wheel} && auditwheel repair -w {dest_dir} {wheel}"

[tool.cibuildwheel.windows]
environment = { CXXFLAGS = "/utf-8" }
before-build = "python -m pip install delvewheel==1.13.2"
repair-wheel-command = "delvewheel repair -w {dest_dir} {wheel}"
