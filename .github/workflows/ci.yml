name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows (MSVC)
          - os: ubuntu-latest
            name: Linux (GCC, Ninja)
            generator: Ninja
            cc: gcc-14
            cxx: g++-14
            packages: g++-14 ninja-build libssl-dev
          - os: ubuntu-latest
            name: Linux (Clang, Makefiles)
            generator: Unix Makefiles
            cc: clang-20
            cxx: clang++-20
            cxxflags: -stdlib=libc++
            packages: clang-20 libc++-20-dev libc++abi-20-dev libssl-dev
          - os: macos-latest
            name: macOS (Apple Clang)
            generator: Ninja
            cc: clang
            cxx: clang++

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python build dependencies
        run: python -m pip install "nanobind>=3.1,<4"

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        env:
          CXXFLAGS: /utf-8
        run: cmake --preset release -DBUILD_TESTING=ON

      - name: Configure CMake (Unix)
        if: runner.os != 'Windows'
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          CXXFLAGS: ${{ matrix.cxxflags }}
        run: cmake --preset release -G "${{ matrix.generator }}" -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build --preset release --parallel

      - name: Test
        run: ctest --test-dir build/release -C Release --output-on-failure --parallel 4 --no-tests=error
