name: Python release artifacts

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install packaging tools
        run: python -m pip install build twine

      - name: Check release version
        shell: python
        run: |
          import os
          import re
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          cmake = Path("CMakeLists.txt").read_text()
          assert re.search(r"project\(mkd-tools VERSION " + re.escape(version) + r"\s", cmake)
          if os.environ["GITHUB_REF_TYPE"] == "tag":
              assert os.environ["GITHUB_REF_NAME"] == "v" + version

      - name: Build source archive
        run: python -m build --sdist --outdir dist

      - name: Check source archive contents
        shell: python
        run: |
          import tarfile
          from pathlib import Path

          archive, = Path("dist").glob("*.tar.gz")
          with tarfile.open(archive) as source:
              paths = {Path(*Path(name).parts[1:]).as_posix() for name in source.getnames()}
          excluded = {"examples", "test", "docs", ".venv", ".cache", ".github", ".idea"}
          assert not any(Path(name).parts[0] in excluded for name in paths if name != ".")
          for dependency in ("glaze", "utf8proc", "pugixml", "cli11", "indicators", "googletest", "zlib"):
              assert f"third_party/{dependency}/CMakeLists.txt" in paths
          assert "third_party/stb/stb_image_resize2.h" in paths
          assert "python/mkd/py.typed" in paths

      - run: python -m twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: python-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  wheels:
    needs: sdist
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
          - os: windows-latest
            arch: AMD64
          - os: ubuntu-latest
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: actions/download-artifact@v4
        with:
          name: python-sdist
          path: dist

      - name: Install wheel tools
        run: python -m pip install cibuildwheel==3.4.1 twine

      - name: Build and verify wheels from source archive
        shell: bash
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
        run: python -m cibuildwheel dist/*.tar.gz --output-dir wheelhouse

      - run: python -m twine check --strict wheelhouse/*

      - uses: actions/upload-artifact@v4
        with:
          name: python-wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: wheelhouse/*.whl
          if-no-files-found: error
